name: End-to-end

on:
  push:
    branches:
      - master
      - "claude/**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "e2e/**"
      - ".github/workflows/e2e.yml"

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # the repository's integration tests, which need nftables, Docker and
  # internet access; also run with the binary to cover landlock and seccomp
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go test -race -count=1 ./dnsproxy/

      - run: |
          go test -c -race -o whalewall.test
          sudo ./whalewall.test -test.timeout 5m -test.v

      - run: |
          cd cmd/whalewall
          CGO_ENABLED=0 go build -o ../../whalewall
          cd ../../
          go test -c -o whalewall.test
          sudo ./whalewall.test -binary-tests -test.run Integration -test.timeout 5m -test.v

  e2e:
    # nftables, Docker and IPv6 are needed, so a VM is required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: capnspacehook/cache-go/restore@v2.0.1

      # Docker only filters IPv6 traffic with ip6tables enabled, and
      # whalewall only manages IPv6 when Docker's IPv6 chains exist
      - name: Enable IPv6 in Docker
        run: |
          sudo apt-get install -y --no-install-recommends nftables
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1 net.bridge.bridge-nf-call-ip6tables=1
          echo '{"ipv6": true, "ip6tables": true, "fixed-cidr-v6": "fd00:d0c:1::/64", "experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          sudo nft list chain ip filter DOCKER-USER
          sudo nft list chain ip6 filter DOCKER-USER

      - name: Run scenarios
        run: sudo env "PATH=$PATH" "HOME=$HOME" E2E_IPV6=1 e2e/run.sh

      - name: Install screenshot renderer
        if: always()
        working-directory: e2e/render
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Render screenshots
        if: always()
        working-directory: e2e/render
        env:
          E2E_IPV6: "1"
        run: |
          sudo chown -R "$USER" ../out
          node render.mjs ../out ../../docs/evidence

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            docs/evidence
            e2e/out/*.log

      # keep the evidence next to the code that produced it
      - name: Commit evidence
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "Update end-to-end evidence from CI"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Save Go cache
        if: always()
        uses: capnspacehook/cache-go/save@v2.0.1
